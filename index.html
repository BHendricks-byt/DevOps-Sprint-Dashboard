*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {

  --accent: #4f8ef7; --green: #22c97a; --amber: #f5a623;
  --red: #f05c5c; --blue: #4f8ef7; --purple: #9b72f5; --teal: #2dd4bf;
  --font-display: 'Sora', sans-serif; --font-mono: 'DM Mono', monospace;
  --radius: 10px; --radius-lg: 16px;
}
body { font-family: var(--font-display); background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.header-left h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
.header-left p { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }
.sprint-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.sprint-btn { font-family: var(--font-mono); font-size: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
.sprint-btn:hover { background: var(--surface2); color: var(--text); }
.sprint-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.badge { font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
.badge-active { background: rgba(34,201,122,0.15); color: var(--green); }
.badge-closed { background: rgba(122,127,148,0.15); color: var(--text-muted); }
.main { padding: 24px 32px; max-width: 1400px; }
.metrics-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-bottom: 20px; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.metric-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.metric-value { font-size: 28px; font-weight: 600; line-height: 1; color: var(--text); }
.metric-value.green { color: var(--green); }
.metric-value.amber { color: var(--amber); }
.metric-value.blue { color: var(--blue); }
.metric-value.purple { color: var(--purple); }
.metric-value.slate { color: #94a3b8; }
.progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; }
.progress-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; min-width: 160px; }
.progress-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
.progress-pct { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--green); min-width: 36px; text-align: right; }
.charts-row { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 12px; margin-bottom: 20px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.panel-title { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
.donut-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 14px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-center-val { font-size: 24px; font-weight: 600; color: var(--text); }
.donut-center-lbl { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
.legend { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.legend-count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text); }
.proj-bars { display: flex; flex-direction: column; gap: 10px; }
.proj-row { display: flex; flex-direction: column; gap: 4px; }
.proj-meta { display: flex; justify-content: space-between; font-size: 12px; }
.proj-name { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
.proj-count { font-family: var(--font-mono); color: var(--text); font-size: 11px; }
.proj-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.proj-fill { height: 100%; border-radius: 2px; background: var(--accent); }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 20px; }
.team-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--accent); flex-shrink: 0; font-family: var(--font-mono); }
.team-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-stats { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 1px; }
.team-sp-bar-wrap { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.team-sp-bar { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s ease; }
.table-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 32px; }
.table-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.table-toolbar .panel-title { margin: 0; flex: 1; }
select { font-family: var(--font-mono); font-size: 11px; padding: 5px 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text-muted); cursor: pointer; outline: none; }
select:focus { border-color: var(--accent); color: var(--text); }
table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
thead tr { background: var(--surface2); }
th { text-align: left; padding: 9px 14px; font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
td { padding: 9px 14px; border-top: 1px solid var(--border); color: var(--text-muted); }
tr:hover td { background: var(--surface2); }
.key-cell { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }
.summary-cell { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; font-weight: 500; }
.sp-cell { text-align: center; font-family: var(--font-mono); }
.closed-note { background: rgba(122,127,148,0.08); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 20px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
.footer-links { display: flex; gap: 16px; justify-content: flex-end; font-size: 11px; font-family: var(--font-mono); margin-bottom: 24px; }
.footer-links a { color: var(--accent); text-decoration: none; opacity: 0.8; }
.footer-links a:hover { opacity: 1; }
.generated-note { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; margin-bottom: 8px; }
@media (max-width: 768px) { .main { padding: 16px; } .metrics-row { grid-template-columns: repeat(3, 1fr); } .charts-row { grid-template-columns: 1fr; } }
</style>
</head>

</div>

  'Done (Production)':'#22c97a','Done':'#22c97a','MOVED TO QA':'#4f8ef7',
  'In Progress':'#f5a623','To Do':'#9b72f5','Parked':'#4a4f63',
  'Canceled':'#f05c5c','Ready For Production':'#2dd4bf','In Review':'#c084fc',
  'Carried Over':'#64748b','CEC Duplicates':'#94a3b8','Automation':'#e879f9'
};
const STATUS_BG = {
  'Done (Production)':'rgba(34,201,122,0.12)','Done':'rgba(34,201,122,0.12)',
  'MOVED TO QA':'rgba(79,142,247,0.12)','In Progress':'rgba(245,166,35,0.12)',
  'To Do':'rgba(155,114,245,0.12)','Parked':'rgba(74,79,99,0.3)',
  'Canceled':'rgba(240,92,92,0.12)','Ready For Production':'rgba(45,212,191,0.12)',
  'In Review':'rgba(192,132,252,0.12)','Carried Over':'rgba(100,116,139,0.2)',
  'CEC Duplicates':'rgba(148,163,184,0.12)','Automation':'rgba(232,121,249,0.12)'
};



let currentSprint = 'Sprint 2';
let currentStatus = 'all';
let currentProject = 'all';
let donutChart = null;

function stats(issues) {
  const done = issues.filter(i => i.status==='Done (Production)'||i.status==='Done').length;
  const carriedOver = issues.filter(i => i.status==='Carried Over').length;
  return {
    total: issues.length,
    sp: issues.reduce((s,i)=>s+(i.sp||0),0),
    done,
    carriedOver,
    inProgress: issues.filter(i=>i.status==='In Progress').length,
    qa: issues.filter(i=>i.status==='MOVED TO QA').length,
    pct: Math.round((done/Math.max(issues.length,1))*100)
  };
}

function renderAll() {
  const s = SPRINTS[currentSprint];
  const issues = s.issues;
  const st = stats(issues);
  const isClosed = s.state === 'Closed';

  // Nav
  document.getElementById('sprint-nav').innerHTML = Object.keys(SPRINTS).map(k => {
    const sp = SPRINTS[k];
    const badge = sp.state === 'Active' ? ' <span class="badge badge-active">Active</span>' : '';
    return `<button class="sprint-btn${k===currentSprint?' active':''}" onclick="switchSprint('${k}')">${k}${badge}</button>`;
  }).join('');

  // Meta
  const stateClass = isClosed ? 'badge-closed' : 'badge-active';
  document.getElementById('sprint-meta').innerHTML = `${s.name} &nbsp;&nbsp; ${s.period} &nbsp;&nbsp;<span class="badge ${stateClass}">${s.state}</span>`;
  document.getElementById('generated-note').textContent = `Data refreshed: ${s.generatedAt} · update via Claude + Atlassian MCP`;

  // Closed sprint notice
  const noteEl = document.getElementById('closed-note');
  if (isClosed) {
    noteEl.style.display = 'block';
    noteEl.textContent = `ℹ️  Closed sprint — ${st.carriedOver} issue${st.carriedOver!==1?'s':''} were not completed and carried over to the next sprint. Their current live status is shown as "Carried Over".`;
  } else {
    noteEl.style.display = 'none';
  }

  // Metrics
  const metric4 = isClosed
    ? `<div class="metric-card"><p class="metric-label">Carried Over</p><p class="metric-value slate">${st.carriedOver}</p></div>`
    : `<div class="metric-card"><p class="metric-label">Moved to QA</p><p class="metric-value blue">${st.qa}</p></div>`;

  document.getElementById('metrics-row').innerHTML = `
    <div class="metric-card"><p class="metric-label">Total issues</p><p class="metric-value">${st.total}</p></div>
    <div class="metric-card"><p class="metric-label">Story points</p><p class="metric-value">${st.sp}</p></div>
    <div class="metric-card"><p class="metric-label">Done</p><p class="metric-value green">${st.done}</p></div>
    <div class="metric-card"><p class="metric-label">In progress</p><p class="metric-value amber">${st.inProgress}</p></div>
    ${metric4}`;

  // Progress
  document.getElementById('progress-fill').style.width = st.pct + '%';
  document.getElementById('progress-pct').textContent = st.pct + '%';
  document.getElementById('progress-label').textContent = isClosed
    ? `${st.done} completed · ${st.carriedOver} carried over · ${issues.filter(i=>i.status==='Canceled').length} canceled`
    : `${st.done} of ${st.total} issues complete`;

  // Donut
  const statusOrder = isClosed
    ? ['Done (Production)','Done','Carried Over','Canceled']
    : ['Done (Production)','Done','MOVED TO QA','Ready For Production','In Progress','To Do','Parked','Canceled','CEC Duplicates','Automation','In Review'];
  const labels = isClosed
    ? ['Done (Prod)','Done','Carried Over','Canceled']
    : ['Done (Prod)','Done','QA','Ready','In Progress','To Do','Parked','Canceled','Duplicates','Automation','In Review'];
  const counts = statusOrder.map(s => issues.filter(i=>i.status===s).length);
  const colors = statusOrder.map(s => STATUS_COLORS[s]||'#4a4f63');

  if (donutChart) { donutChart.destroy(); donutChart = null; }
  donutChart = new Chart(document.getElementById('donut'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderWidth: 0 }] },
    options: { responsive:true, maintainAspectRatio:true, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.raw}` } } } }
  });
  document.getElementById('donut-done').textContent = st.done;

  document.getElementById('status-legend').innerHTML = labels.map((lbl,i) => counts[i] > 0 ? `
    <div class="legend-item">
      <span class="legend-dot" style="background:${colors[i]}"></span>
      <span>${lbl}</span>
      <span class="legend-count">${counts[i]}</span>
    </div>` : '').join('');

  // Project bars
  const proj = {};
  issues.forEach(i => { proj[i.project]=(proj[i.project]||0)+1; });
  const sorted = Object.entries(proj).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const max = sorted[0][1];
  document.getElementById('proj-bars').innerHTML = sorted.map(([name,count]) => `
    <div class="proj-row">
      <div class="proj-meta"><span class="proj-name">${name}</span><span class="proj-count">${count}</span></div>
      <div class="proj-track"><div class="proj-fill" style="width:${Math.round((count/max)*100)}%"></div></div>
    </div>`).join('');

  // Team workload — use spOverride (from Jira) if available, otherwise sum from issue data
  const spOverride = s.spOverride || {};
  const team = {};
  issues.forEach(i => {
    if (!team[i.assignee]) team[i.assignee] = { issues: 0, rawSP: 0 };
    team[i.assignee].issues++;
    team[i.assignee].rawSP += i.sp || 0;
  });

  // Apply overrides
  Object.keys(team).forEach(name => {
    team[name].sp = spOverride[name] !== undefined ? spOverride[name] : team[name].rawSP;
  });

  const maxSP = Math.max(...Object.values(team).map(d => d.sp), 1);

  document.getElementById('team-grid').innerHTML = Object.entries(team)
    .sort((a, b) => b[1].sp - a[1].sp)
    .map(([name, d]) => {
      const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      const spLabel = d.sp > 0
        ? `${d.sp} SP · ${d.issues} issues`
        : `${d.issues} issues · no SP`;
      const barPct = Math.round((d.sp / maxSP) * 100);
      const spBar = d.sp > 0
        ? `<div class="team-sp-bar-wrap"><div class="team-sp-bar" style="width:${barPct}%"></div></div>`
        : '';
      return `<div class="team-card">
        <div class="avatar">${initials}</div>
        <div style="overflow:hidden;flex:1;">
          <p class="team-name">${name}</p>
          <p class="team-stats">${spLabel}</p>
          ${spBar}
        </div>
      </div>`;
    }).join('');

  // Project filter
  const projects = [...new Set(issues.map(i=>i.project))].sort();
  document.getElementById('project-filter').innerHTML = '<option value="all">All projects</option>' +
    projects.map(p=>`<option value="${p}"${currentProject===p?' selected':''}>${p}</option>`).join('');

  // Status filter — show/hide Carried Over option based on sprint type
  const sf = document.getElementById('status-filter');
  const coOpt = sf.querySelector('option[value="Carried Over"]');
  coOpt.style.display = isClosed ? '' : 'none';

  renderTable(issues);
}

function renderTable(issues) {
  let f = issues;
  if(currentStatus!=='all') f=f.filter(i=>i.status===currentStatus);
  if(currentProject!=='all') f=f.filter(i=>i.project===currentProject);
  document.getElementById('issue-tbody').innerHTML = f.map(i=>`
    <tr>
      <td class="key-cell">${i.key}</td>
      <td class="summary-cell" title="${i.summary}">${i.summary}</td>
      <td style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.project}</td>
      <td><span class="pill" style="background:${STATUS_BG[i.status]||'rgba(74,79,99,0.3)'};color:${STATUS_COLORS[i.status]||'#4a4f63'}">${i.status}</span></td>
      <td style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.assignee}</td>
      <td class="sp-cell">${i.sp||'—'}</td>
    </tr>`).join('');
}

function switchSprint(k) {
  currentSprint=k; currentStatus='all'; currentProject='all';
  document.getElementById('status-filter').value='all';
  renderAll();
}

document.getElementById('status-filter').addEventListener('change', e=>{ currentStatus=e.target.value; renderTable(SPRINTS[currentSprint].issues); });
document.getElementById('project-filter').addEventListener('change', e=>{ currentProject=e.target.value; renderTable(SPRINTS[currentSprint].issues); });

renderAll();
</script>
</body>
</html>
